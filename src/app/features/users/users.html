<div class="p-4">
  <div class="flex justify-content-between align-items-center mb-4">
    <h1 class="m-0 text-2xl font-semibold">Gestión de Usuarios</h1>
    <p-button label="Nuevo Usuario" icon="pi pi-plus" severity="primary" />
  </div>

  <p-table 
    [value]="users" 
    [loading]="loading" 
    [paginator]="true" 
    [rows]="5" 
    [tableStyle]="{ 'min-width': '50rem' }"
    class="p-datatable-striped shadow-1 border-round overflow-hidden">
    
    <ng-template pTemplate="caption">
      <div class="flex justify-content-end">
        <p-iconfield iconPosition="left">
          <p-inputicon class="pi pi-search" />
          <input pInputText type="text" placeholder="Buscar usuario..." />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Último Acceso</th>
        <th style="width: 8rem">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>
          <div class="flex align-items-center gap-2">
            <img [src]="user.avatar || '/mockups/images/default.png'" width="32" class="border-circle" />
            <span class="font-medium">{{ user.name }}</span>
          </div>
        </td>
        <td>{{ user.email }}</td>
        <td>
          <span class="text-600 font-medium">{{ user.role }}</span>
        </td>
        <td>
          <p-tag [value]="user.status" [severity]="getSeverity(user.status)" />
        </td>
        <td>{{ user.lastLogin | date:'short' }}</td>
        <td>
          <div class="flex gap-2">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center p-4">No se encontraron usuarios.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
