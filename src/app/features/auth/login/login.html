<p-toast />

<section class="min-h-screen flex align-items-center justify-content-center surface-ground p-4">
  @if (loading) {
    <div class="loading-overlay">
      <p-progressSpinner strokeWidth="4"></p-progressSpinner>
    </div>
  }

  <div class="surface-card p-0 shadow-4 border-round flex w-full overflow-hidden" style="max-width: 1100px; min-height: 75vh;">
    
    <div class="w-full md:w-6 flex flex-column justify-content-center py-6 px-4 md:px-7 relative">
      
      <div class="text-center mb-5">
        <div class="text-900 text-3xl font-bold mb-2">Bienvenido de vuelta</div>
        <span class="text-600 font-medium">Inicia sesión para acceder al panel</span>
      </div>

      @if (!forgottenPassword) {
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">
          <div class="flex flex-column gap-2">
            <label htmlFor="email" class="font-medium text-900">Correo Electrónico</label>
            <input pInputText id="email" type="email" formControlName="email" class="w-full p-3" />
          </div>

          <div class="flex flex-column gap-2">
            <label htmlFor="password" class="font-medium text-900">Contraseña</label>
            <input pInputText id="password" type="password" formControlName="password" class="w-full p-3" />
          </div>

          <div class="flex justify-content-end w-full">
            <a class="font-medium no-underline cursor-pointer text-primary hover:underline" (click)="forgottenPassword = true">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <p-button label="Iniciar Sesión" type="submit" styleClass="w-full p-3 text-lg mt-2" [loading]="loading"></p-button>
        </form>
      } @else {
        <form [formGroup]="forgottenForm" class="flex flex-column gap-4">
          <div class="text-center mb-2">
            <span class="text-600">Ingresa tu correo para recuperar tu acceso.</span>
          </div>

          <div class="flex flex-column gap-2">
            <label htmlFor="recovery-email" class="font-medium text-900">Correo Electrónico</label>
            <input pInputText id="recovery-email" type="email" formControlName="email" class="w-full p-3" />
          </div>

          <div class="flex justify-content-end w-full">
            <a class="font-medium no-underline cursor-pointer text-primary hover:underline" (click)="forgottenPassword = false">
              Volver al inicio de sesión
            </a>
          </div>

          <p-button label="Recuperar Contraseña" (onClick)="recoverPassword()" styleClass="w-full p-3 text-lg mt-2"></p-button>
        </form>
      }

      <div class="absolute bottom-0 left-50 pb-4" style="transform: translateX(-50%);">
        <span class="text-500 text-sm font-medium">México-USA Logistics © 2026</span>
      </div>
    </div>

    <div class="hidden md:flex w-6 justify-content-center align-items-center surface-200">
      <img src="/mockups/images/default.png" alt="login image" class="w-full h-full" style="object-fit: cover;" />
    </div>
    
  </div>
</section>
